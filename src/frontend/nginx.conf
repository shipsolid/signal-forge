server {
    # 8080, not 80: the image is nginxinc/nginx-unprivileged which runs as
    # UID 101 and cannot bind to ports < 1024 without CAP_NET_BIND_SERVICE.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js carries runtime config injected at container startup.
    # Must NOT be cached so that a pod restart with new env vars takes effect
    # immediately without a browser cache flush.
    location = /assets/env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # Cache all other static assets aggressively (hashed filenames from Angular build).
    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
