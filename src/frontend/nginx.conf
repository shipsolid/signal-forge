# Security headers, shared across every location block below. nginx's add_header
# is NOT inherited into a location that declares its own add_header (a well-known
# gotcha), so this is duplicated wherever a location sets Cache-Control — see
# https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header.
#
# connect-src allows grafana.net rather than a single fixed host because the Faro
# RUM collector URL is mounted into assets/env.js via a ConfigMap (see
# deploy-local.sh's apply_frontend_env_configmap()) — it can point at any
# Grafana Cloud stack's collector subdomain
# depending on which credentials are configured, so it can't be pinned tighter
# than the provider's domain without breaking cloud-mode RUM on stack rotation.
# style-src allows 'unsafe-inline' because Angular's default (emulated) view
# encapsulation injects per-component <style> tags into the DOM at runtime; doing
# better requires wiring Angular's ngCspNonce mechanism, out of scope here.
map $host $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.grafana.net; frame-ancestors 'none'; base-uri 'self'";
}

server {
    # 8080, not 80: the image is nginxinc/nginx-unprivileged which runs as
    # UID 101 and cannot bind to ports < 1024 without CAP_NET_BIND_SERVICE.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy $csp_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA routing — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js carries runtime config mounted from a ConfigMap (see
    # deploy-local.sh's apply_frontend_env_configmap()).
    # Must NOT be cached so that a pod restart with new env vars takes effect
    # immediately without a browser cache flush.
    location = /assets/env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy $csp_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires off;
    }

    # Cache all other static assets aggressively (hashed filenames from Angular build).
    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
