name: Docs

# Builds docs/ (+ README.md) via the shared Starlight engine and publishes to
# https://shipsolid.github.io/signal-forge/. Per-repo config: docs-site.yaml.
#
# @main is deliberate — this org owns shipsolid/docs-site and every consumer
# tracks its main so engine fixes land without a version bump here. The guard
# against a breaking change is the engine repo's CI, which runs its end-to-end
# fixture build (tests/fixture-build.test.mjs) on every change.
#
# One-time: repo Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "docs-site.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "docs-site.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# No workflow-level permissions — the reusable workflow's build job needs only
# the default read scope; pages:write + id-token:write are granted to this one
# job because the engine's deploy job (skipped on PRs, deploy=false) mints an
# OIDC token for actions/deploy-pages.
jobs:
  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: shipsolid/docs-site/.github/workflows/build-deploy.yml@main
    with:
      # Publish only from main: a push here is already main-filtered; a manual
      # dispatch from a feature branch build-checks without touching prod Pages.
      deploy: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
