name: Scheduled vulnerability re-scan

# The main CI image gate ignores vulnerabilities that have no upstream fix,
# because rebuilding cannot remediate them. This audit repeats the scan without
# `ignore-unfixed` so a newly actionable finding is visible in code scanning.
#
# Scope is intentionally explicit: this workflow examines the current mutable
# `latest` compatibility tags, not every immutable digest deployed in DEV/QA/
# PROD. `latest` is never a CD input. A complete deployed-inventory rescan would
# need to enumerate release manifests or cluster imageIDs instead.
#
# The schedule remains commented while this is an opt-in lab control, so today
# only `workflow_dispatch` runs it. Uncommenting the cron is an organizational
# policy decision, not a prerequisite for the blocking scan performed at build.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC

jobs:
  rescan:
    name: Re-scan published images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [otel-frontend, gateway-api, order-api, notification-svc]
    steps:
      - name: Pull latest published image
        # This tag answers "what would a new main build currently expose?" It
        # does not prove the result applies to an older promoted digest.
        run: docker pull "ghcr.io/${{ github.repository_owner }}/signal-forge/${{ matrix.service }}:latest"

      # No ignore-unfixed here, deliberately — the whole point of this
      # workflow is to catch a fix that's appeared since the image was built.
      - name: Trivy re-scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "ghcr.io/${{ github.repository_owner }}/signal-forge/${{ matrix.service }}:latest"
          format: sarif
          output: trivy-rescan-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          # Report-only is deliberate: there is no PR or release transaction to
          # block here. Findings land in GitHub code scanning for remediation.
          exit-code: "0"
          vuln-type: os,library

      - name: Upload Trivy SARIF to GitHub code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-rescan-${{ matrix.service }}.sarif
          category: trivy-rescan-${{ matrix.service }}
