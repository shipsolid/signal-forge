name: CI

# Release contract:
#   * pull requests execute the complete validation/build/scan path but never
#     authenticate to GHCR or publish release metadata;
#   * trusted pushes to main execute the same gates, then build each service
#     image once, scan that local image, publish it, and capture its registry
#     digest;
#   * CD consumes the resulting four-image release manifest. It does not
#     reconstruct tags from source or rebuild an image for an environment.
#
# The path filters intentionally include deployment and operational policy
# assets. A change to telemetry, infrastructure, or the release machinery is a
# product change even when no application source file moved.
'on':
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'docs/operations/**'
      - '.github/workflows/**'
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - '.yamllint'
      - 'conf.yml'
      - 'deploy-local.sh'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'docs/operations/**'
      - '.github/workflows/**'
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - '.yamllint'
      - 'conf.yml'
      - 'deploy-local.sh'
      - 'Makefile'

permissions:
  # Jobs inherit read-only repository access unless they explicitly request a
  # narrower write capability such as SARIF upload, GHCR publication, or OIDC.
  contents: read

concurrency:
  # New commits supersede in-flight validation for the same PR/branch. Published
  # main releases are protected by job ordering; CD has its own non-cancelling
  # promotion lock because interrupting a deployment is unsafe.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secrets — Gitleaks (BLOCKING)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Gitleaks needs commit history to detect a credential introduced and
          # then deleted inside the range being evaluated.
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pre-commit:
    name: Lint + repository policy (BLOCKING)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install pre-commit
        run: pip install pre-commit==4.6.0

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Restore .NET projects
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            dotnet restore "$project"
          done < <(find src -mindepth 2 -maxdepth 2 -name '*.csproj' -print | sort)

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: src/frontend

      - name: Run pre-commit on all files
        # Gitleaks is skipped here because the dedicated secret-scan job checks
        # full Git history. Keeping one authoritative invocation avoids two
        # tools reporting the same finding with different commit ranges.
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  test-dotnet:
    name: Unit tests — .NET (BLOCKING)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            dotnet restore "$project"
            dotnet build "$project" --no-restore --configuration Release
          done < <(find src -mindepth 2 -maxdepth 2 -name '*.csproj' -print | sort)

      - name: Test order-api
        run: >-
          dotnet test src/order-api.Tests/order-api.Tests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=order-api-results.trx"

      - name: Test gateway-api
        run: >-
          dotnet test src/gateway-api.Tests/gateway-api.Tests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=gateway-api-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dotnet-test-results
          path: src/**/*.trx
          if-no-files-found: error

  test-python:
    name: Unit tests — Python (BLOCKING)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/notification-svc/requirements-test.txt

      - name: Install dependencies
        run: pip install -r src/notification-svc/requirements-test.txt

      - name: Test notification-svc
        run: python -m pytest src/notification-svc/tests/ -v --tb=short

  test-frontend:
    name: Unit tests + build — frontend (BLOCKING)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: src/frontend

      - name: Test
        run: npx jest --config jest.config.js --ci
        working-directory: src/frontend

      - name: Production build
        run: npm run build
        working-directory: src/frontend

  proto-contract:
    name: API contract — protobuf (BLOCKING)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Check canonical protobuf consumers
        shell: bash
        run: |
          set -euo pipefail
          # Both .NET services must compile the one canonical contract. A copied
          # service-local .proto can drift while still compiling, so duplicates
          # are treated as a release-policy violation rather than a style issue.
          status=0
          [[ -f src/proto/orders.proto ]] || status=1
          for project in src/gateway-api/gateway-api.csproj src/order-api/order-api.csproj; do
            if ! grep -Fq '<Protobuf Include="..\proto\orders.proto"' "$project"; then
              echo "::error file=${project}::Project must reference src/proto/orders.proto"
              status=1
            fi
          done
          for duplicate in src/gateway-api/Protos/orders.proto src/order-api/Protos/orders.proto; do
            if [[ -e "$duplicate" ]]; then
              echo "::error file=${duplicate}::Remove duplicate protobuf contract"
              status=1
            fi
          done
          exit "$status"

  sast:
    name: SAST — CodeQL ${{ matrix.language }} (BLOCKING)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      # Each language database is independent. Running all entries even after
      # one failure preserves complete security feedback for the commit.
      fail-fast: false
      matrix:
        include:
          - language: csharp
            # C# needs an explicit build so CodeQL observes generated gRPC code
            # and the actual compilation graph. Interpreted languages can use
            # build-mode none.
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '8.0.x'

      - name: Build C# for CodeQL
        if: matrix.language == 'csharp'
        run: |
          dotnet build src/gateway-api/gateway-api.csproj --configuration Release
          dotnet build src/order-api/order-api.csproj --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          category: /language:${{ matrix.language }}

  sca:
    name: SCA — application dependencies (BLOCKING)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '8.0.x'

      - name: Scan direct and transitive .NET dependencies
        shell: bash
        run: |
          set -euo pipefail
          : > vulnerability-dotnet.txt
          while IFS= read -r project; do
            dotnet restore "$project"
            dotnet list "$project" package --vulnerable --include-transitive \
              2>&1 | tee -a vulnerability-dotnet.txt
          done < <(find src -mindepth 2 -maxdepth 2 -name '*.csproj' -print | sort)
          if grep -q "has the following vulnerable packages" vulnerability-dotnet.txt; then
            echo "::error::.NET dependency vulnerabilities found"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/notification-svc/requirements-test.txt

      - name: Scan Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install pip-audit==2.9.0
          set +e
          pip-audit -r src/notification-svc/requirements-test.txt \
            --format json --output vulnerability-python.json
          audit_status=$?
          set -e
          if [[ "$audit_status" -gt 1 ]]; then
            echo "::error::pip-audit failed to complete"
            exit "$audit_status"
          fi
          if [[ "$audit_status" -eq 1 ]]; then
            echo "::error::Python dependency vulnerabilities found"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Scan frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --json > ../../vulnerability-frontend.json
          audit_status=$?
          set -e
          if [[ "$audit_status" -gt 1 ]]; then
            echo "::error::npm audit failed to complete"
            exit "$audit_status"
          fi
          jq -e '.metadata.vulnerabilities | type == "object"' \
            ../../vulnerability-frontend.json > /dev/null
          all_critical="$(jq '.metadata.vulnerabilities.critical // 0' \
            ../../vulnerability-frontend.json)"
          if [[ "$all_critical" -gt 0 ]]; then
            echo "::warning::npm reported $all_critical critical findings in the full dependency tree"
          fi

          # Runtime dependencies are blocking. Development-only findings remain
          # visible in the audit artifact and are handled as tracked policy debt.
          npm audit --omit=dev --audit-level=critical
        working-directory: src/frontend

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dependency-vulnerability-reports
          path: |
            vulnerability-dotnet.txt
            vulnerability-python.json
            vulnerability-frontend.json
          if-no-files-found: warn

  iac-security:
    name: IaC security — Trivy config (BLOCKING)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Scan Kubernetes, Dockerfile, and configuration assets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          severity: HIGH,CRITICAL
          # Trivy must finish and leave a complete SARIF document so the next
          # step can apply this repository's severity policy: CRITICAL blocks,
          # HIGH warns. This zero is not failure suppression.
          exit-code: '0'

      - name: Enforce blocking IaC severity policy
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.runs | type == "array"' trivy-iac.sarif > /dev/null
          critical_count="$(jq '[
            .runs[].results[]?
            | select((.message.text // "") | contains("Severity: CRITICAL"))
          ] | length' trivy-iac.sarif)"
          high_count="$(jq '[
            .runs[].results[]?
            | select((.message.text // "") | contains("Severity: HIGH"))
          ] | length' trivy-iac.sarif)"
          if [[ "$critical_count" -gt 0 ]]; then
            echo "::error::Trivy found $critical_count CRITICAL IaC misconfigurations"
            exit 1
          fi
          if [[ "$high_count" -gt 0 ]]; then
            echo "::warning::Trivy reported $high_count HIGH IaC findings; review the SARIF report"
          fi
          echo "IaC policy passed: no CRITICAL misconfigurations."

      - name: Upload IaC findings
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  observability-policy:
    name: Observability-as-policy (BLOCKING)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Validate telemetry contracts, cardinality, dashboards, and templates
        # This is a release control, not an informational lint. It verifies that
        # the application and collector still agree on service identity and
        # required resource attributes before an image can be published.
        run: |
          pip install PyYAML==6.0.3
          python -m unittest discover -s scripts/ci/tests -v
          python scripts/ci/validate_observability.py --output-dir .tmp/observability

      - name: Validate Prometheus rules
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "${{ github.workspace }}:/workspace:ro"
          prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
          check rules /workspace/k8s/monitoring/slo-rules.yaml

      - name: Validate rendered Grafana Alloy configuration
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/.tmp/observability:/work:ro"
          grafana/alloy@sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
          validate /work/config.alloy

  quality-gate:
    name: Security + observability policy gate
    # `always()` makes the aggregator run even when an upstream job fails or is
    # cancelled. It then accepts only `success`; skipped/cancelled checks cannot
    # accidentally satisfy the publication dependency.
    if: always()
    needs:
      - secret-scan
      - pre-commit
      - test-dotnet
      - test-python
      - test-frontend
      - proto-contract
      - sast
      - sca
      - iac-security
      - observability-policy
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::At least one blocking CI control did not succeed: $RESULTS"
              exit 1
            fi
          done
          echo "All blocking CI controls passed."

  build-images:
    name: Build once + scan + publish — ${{ matrix.service.name }}
    # No image exists before every blocking application, security, IaC, and
    # observability check has passed. This dependency is the boundary between
    # validation and creation of a releasable supply-chain artifact.
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      security-events: write
    strategy:
      # A service failure does not hide scan/build results for the other
      # services, but release-metadata cannot fan in unless every entry passes.
      fail-fast: false
      matrix:
        service:
          - name: otel-frontend
            context: src/frontend
          - name: gateway-api
            context: src/gateway-api
          - name: order-api
            context: src/order-api
          - name: notification-svc
            context: src/notification-svc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Stage shared protobuf sources
        if: matrix.service.name == 'order-api' || matrix.service.name == 'gateway-api'
        run: |
          # Docker contexts are deliberately service-scoped. Stage the canonical
          # repo-level contract without widening the context and leaking other
          # source/build artifacts into either image.
          mkdir -p "${{ matrix.service.context }}/proto"
          cp src/proto/orders.proto src/proto/OrderValidation.cs \
            "${{ matrix.service.context }}/proto/"

      - name: Build release image exactly once
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: ${{ matrix.service.context }}
          # Load one local Docker image so SBOM and Trivy inspect the exact image
          # later tagged and pushed. There is intentionally no second registry
          # build after scanning.
          push: false
          load: true
          tags: ${{ matrix.service.name }}:ci-${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: ${{ matrix.service.name }}:ci-${{ github.run_id }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service.name }}.cdx.json
          upload-artifact: false

      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ matrix.service.name }}:ci-${{ github.run_id }}
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: os,library

      - name: Upload container findings
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service.name)) != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif
          category: trivy-${{ matrix.service.name }}

      - name: Upload SBOM artifact
        if: always() && hashFiles(format('sbom-{0}.cdx.json', matrix.service.name)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: sbom-${{ matrix.service.name }}.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image and capture its registry digest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/signal-forge/${{ matrix.service.name }}"
          local_image="${{ matrix.service.name }}:ci-${GITHUB_RUN_ID}"

          # The commit tag provides a human-friendly lookup and `latest` remains
          # only for the legacy scheduled rescan. Neither is a CD input: the
          # registry-reported digest captured below is the deployment identity.
          docker tag "$local_image" "${image}:${GITHUB_SHA}"
          docker tag "$local_image" "${image}:latest"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"

          digest="$(docker buildx imagetools inspect \
            "${image}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Registry returned an invalid digest: $digest"
            exit 1
          fi
          {
            echo "image=$image"
            echo "digest=$digest"
            echo "reference=${image}@${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign and attest the immutable image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          set -euo pipefail
          # Keyless signing binds the immutable digest to this main-branch
          # workflow identity through GitHub OIDC. No reusable private signing
          # key is stored in repository or environment secrets.
          cosign sign --yes "$IMAGE_REFERENCE"
          cosign attest --yes \
            --predicate "sbom-${{ matrix.service.name }}.cdx.json" \
            --type cyclonedx \
            "$IMAGE_REFERENCE"

      - name: Verify signature and SBOM attestation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          set -euo pipefail
          # Verify immediately with the same identity policy CD applies. This
          # catches an issuance/attestation mistake before metadata is promoted
          # as a release, rather than discovering it during deployment.
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$IMAGE_REFERENCE" > /dev/null
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$IMAGE_REFERENCE" > /dev/null

      - name: Write immutable image metadata
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          # Matrix jobs cannot safely append to one shared file. Each service
          # emits one self-contained record; release-metadata downloads and
          # validates all four records as an atomic fan-in step.
          mkdir -p image-metadata
          jq -n \
            --arg service "${{ matrix.service.name }}" \
            --arg repository "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg reference "$REFERENCE" \
            --arg sbom_artifact "sbom-${{ matrix.service.name }}-${GITHUB_RUN_ATTEMPT}" \
            '{
              service: $service,
              repository: $repository,
              digest: $digest,
              reference: $reference,
              sbom: {format: "cyclonedx-json", artifact: $sbom_artifact},
              signature: {provider: "sigstore-keyless", reference: $reference},
              attestation: {type: "cyclonedx", reference: $reference}
            }' > "image-metadata/${{ matrix.service.name }}.json"

      - name: Upload immutable image metadata
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          # Include run_attempt so a re-run cannot accidentally combine fresh
          # metadata with artifacts retained from an earlier failed attempt.
          name: image-metadata-${{ matrix.service.name }}-${{ github.run_attempt }}
          path: image-metadata/${{ matrix.service.name }}.json
          if-no-files-found: error
          retention-days: 90

  release-metadata:
    name: Publish immutable release manifest
    # The manifest is the only supported CI-to-CD release contract. It is
    # published only when all four matrix jobs have built, scanned, pushed,
    # signed, attested, and verified their images.
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      git-sha: ${{ steps.manifest.outputs.git-sha }}
    steps:
      - name: Download component metadata
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          pattern: image-metadata-*-${{ github.run_attempt }}
          path: release-parts
          merge-multiple: true

      - name: Assemble release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          # Exactly four component records prevents a partial microservice set
          # from looking deployable. Promotion and rollback both operate on the
          # complete set, even if only one service changed.
          mapfile -t parts < <(find release-parts -type f -name '*.json' -print | sort)
          if [[ "${#parts[@]}" -ne 4 ]]; then
            echo "::error::Expected metadata for four images, found ${#parts[@]}"
            exit 1
          fi

          images="$(jq -s '
            map({key: .service, value: del(.service)}) | from_entries
          ' "${parts[@]}")"
          jq -n \
            --arg git_sha "$GITHUB_SHA" \
            --arg git_ref "$GITHUB_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson images "$images" \
            '{
              schema_version: 1,
              release_id: ($git_sha + "-" + ($run_id | tostring)),
              git: {repository: $repository, commit: $git_sha, ref: $git_ref},
              build: {
                workflow: ".github/workflows/ci.yml",
                run_id: $run_id,
                run_attempt: $run_attempt,
                url: $run_url
              },
              images: $images
            }' > release-manifest.json

          jq -e '
            .schema_version == 1 and
            (.git.commit | test("^[0-9a-f]{40}$")) and
            (.images | keys | sort == [
              "gateway-api", "notification-svc", "order-api", "otel-frontend"
            ]) and
            all(.images[]; .reference == (.repository + "@" + .digest))
          ' release-manifest.json > /dev/null
          echo "git-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          # CD resolves this exact run-attempt name after validating the source
          # workflow run. The attempt suffix is part of the anti-mixing boundary.
          name: release-manifest-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish release summary
        run: |
          {
            echo "## Immutable release"
            echo
            echo "- Git commit: $GITHUB_SHA"
            echo "- CI run: $GITHUB_RUN_ID"
            echo "- Artifact: release-manifest-${GITHUB_RUN_ATTEMPT}"
            echo
            jq -r '.images | to_entries[] | "- \(.key): \(.value.reference)"' \
              release-manifest.json
          } >> "$GITHUB_STEP_SUMMARY"
