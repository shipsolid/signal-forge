name: CI

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'k8s/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - 'conf.yml'
      - 'deploy-local.sh'
      - 'Makefile'

jobs:
  secret-scan:
  # ── Secret scanning ──────────────────────────────────────────────────────────
  # Catches committed secrets before they land in history — the exact class of
  # exposure (a live Grafana Cloud token + an Azure SP client secret, both in
  # conf.yml.bak/.env) that required a one-time git-history rewrite to fix. See
  # docs/reviews/2026-07-08-principal-staff-review.md §1. .gitleaks.toml
  # allowlists k8s/infra/secrets.yaml's known dev-only placeholder credentials.
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, not just the current ref

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  pre-commit:
  # ── Pre-commit hooks (formatting/lint/hygiene/manifest sanity) ─────────────
  # Mirrors what `pre-commit install` runs locally on every commit — see
  # .pre-commit-config.yaml and CLAUDE.md's "Pre-commit hooks" section.
  # Runs for manual dispatches and relevant pushes to main.
  #
  # SKIP=gitleaks: the gitleaks hook's default entry scans `git diff --staged`
  # (built for the local commit-time hook) — that's empty on a fresh CI
  # checkout, so it would trivially report "no leaks found" without actually
  # scanning anything. Full-history secret scanning is already covered by
  # the secret-scan job above (gitleaks-action, fetch-depth 0); no need to
  # duplicate it here with a check that can't actually catch anything.
    name: Pre-commit hooks (all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install pre-commit
        run: pip install pre-commit==4.6.0

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Restore .NET projects
        run: |
          dotnet restore src/order-api/order-api.csproj
          dotnet restore src/order-api.Tests/order-api.Tests.csproj
          dotnet restore src/gateway-api/gateway-api.csproj
          dotnet restore src/gateway-api.Tests/gateway-api.Tests.csproj
          dotnet restore src/integration-tests/integration-tests.csproj

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: src/frontend

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks


  test-dotnet:
  # ── .NET services ────────────────────────────────────────────────────────────
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          while IFS= read -r project; do
            dotnet restore "$project"
          done < <(find src -mindepth 2 -maxdepth 2 -name '*.csproj' -print | sort)

      - name: Build
        run: |
          while IFS= read -r project; do
            dotnet build "$project" --no-restore --configuration Release
          done < <(find src -mindepth 2 -maxdepth 2 -name '*.csproj' -print | sort)

      - name: Test — order-api
        run: dotnet test src/order-api.Tests/order-api.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=order-api-results.trx"

      - name: Test — gateway-api
        run: dotnet test src/gateway-api.Tests/gateway-api.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=gateway-api-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: src/**/*.trx


  test-python:
  # ── Python service ───────────────────────────────────────────────────────────
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/notification-svc/requirements-test.txt

      - name: Install dependencies
        run: pip install -r src/notification-svc/requirements-test.txt

      - name: Test — notification-svc
        run: python -m pytest src/notification-svc/tests/ -v --tb=short


  test-frontend:
  # ── Angular frontend ─────────────────────────────────────────────────────────
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps
        working-directory: src/frontend

      - name: Test — frontend
        run: npx jest --config jest.config.js --ci
        working-directory: src/frontend

      # Trivy's frontend scan (build-images job) only ever sees the final
      # nginx runtime image, after the multi-stage build has already
      # discarded node_modules/package.json — there was no JS dependency
      # scanning anywhere in CI. This runs against the real lockfile.
      # Gated on critical only, not high (matching Trivy's own
      # ignore-unfixed reasoning below): the 8 current high-severity
      # findings all require a Angular v17→v20+ major-version migration to
      # fix — a real, tracked gap, but disproportionate to force here.
      - name: Scan frontend dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
        working-directory: src/frontend


  proto-contract:
  # ── Proto contract ───────────────────────────────────────────────────────────────
  # orders.proto has one canonical copy. Both .NET services must generate their
  # client/server stubs directly from it rather than introducing local copies.
    name: Proto contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check services consume the canonical orders.proto
        run: |
          ok=true
          if [[ ! -f src/proto/orders.proto ]]; then
            echo "::error file=src/proto/orders.proto::Canonical proto contract is missing"
            ok=false
          fi
          for project in src/gateway-api/gateway-api.csproj src/order-api/order-api.csproj; do
            if ! grep -Fq '<Protobuf Include="..\proto\orders.proto"' "$project"; then
              echo "::error file=${project}::Project must reference the canonical src/proto/orders.proto"
              ok=false
            fi
          done
          for duplicate in src/gateway-api/Protos/orders.proto src/order-api/Protos/orders.proto; do
            if [[ -e "$duplicate" ]]; then
              echo "::error file=${duplicate}::Remove the duplicate and consume src/proto/orders.proto directly"
              ok=false
            fi
          done
          $ok && echo "Both services consume the canonical proto contract."
          $ok


  vuln-scan:
  # ── Vulnerability scanning ───────────────────────────────────────────────────
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET packages
        run: |
          while IFS= read -r project; do
            dotnet restore "$project"
          done < <(find src -mindepth 2 -maxdepth 2 -name '*.csproj' -print | sort)

      - name: Scan .NET packages for known vulnerabilities
        run: |
          : > vuln-dotnet.txt
          while IFS= read -r project; do
            echo "Scanning ${project}" | tee -a vuln-dotnet.txt
            dotnet list "$project" package --vulnerable --include-transitive 2>&1 | tee -a vuln-dotnet.txt
          done < <(find src -mindepth 2 -maxdepth 2 -name '*.csproj' -print | sort)
          if grep -q "has the following vulnerable packages" vuln-dotnet.txt; then
            echo "::error::Vulnerable .NET packages found"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Python packages for known vulnerabilities
        run: pip-audit -r src/notification-svc/requirements.txt --format json --output vuln-python.json || true

      - name: Fail on Python vulnerabilities
        run: |
          if python3 -c "import json,sys; deps=json.load(open('vuln-python.json')).get('dependencies',[]); sys.exit(1 if any(d.get('vulns') for d in deps) else 0)"; then
            echo "No vulnerable Python packages found"
          else
            cat vuln-python.json
            echo "::error::Vulnerable Python packages found"
            exit 1
          fi

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-reports
          path: |
            vuln-dotnet.txt
            vuln-python.json


  build-images:
  # ── Docker builds + supply-chain ─────────────────────────────────────────
  # Every image is built, scanned (Trivy), SBOM'd (Syft), and signed (cosign).
  # Signing uses keyless OIDC — no long-lived secrets. Requires `id-token: write`
  # at the job level so the runner can fetch a Sigstore OIDC token.
    name: Build + scan + SBOM + sign
    runs-on: ubuntu-latest
    permissions:
      actions: read     # CodeQL SARIF upload telemetry reads the workflow run
      contents: read
      id-token: write   # cosign keyless OIDC
      packages: write   # push to ghcr.io on main
      security-events: write  # upload Trivy SARIF
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: otel-frontend
            context: src/frontend
          - name: gateway-api
            context: src/gateway-api
          - name: order-api
            context: src/order-api
          - name: notification-svc
            context: src/notification-svc
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # order-api/gateway-api's .csproj reference ../proto (src/proto/, single
      # source of truth for orders.proto + OrderValidation.cs) via a relative
      # path outside their own build context — invisible to docker/build-push-
      # action's context scoping otherwise. Same staging deploy-local.sh's
      # build_images() does locally (stage_shared_proto); see either
      # Dockerfile's COPY proto/ /proto/ comment for the full explanation.
      - name: Stage shared proto
        if: matrix.service.name == 'order-api' || matrix.service.name == 'gateway-api'
        run: |
          mkdir -p "${{ matrix.service.context }}/proto"
          cp src/proto/orders.proto src/proto/OrderValidation.cs "${{ matrix.service.context }}/proto/"

      # Build once, load locally so Trivy/Syft can scan the same artifact.
      - name: Build ${{ matrix.service.name }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: false
          load: true
          tags: ${{ matrix.service.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Image vulnerability scan (Trivy) ──────────────────────────────
      # Fail the job on HIGH or CRITICAL vulnerabilities with a fix available.
      # Unfixed are reported but don't block (nothing we can do about them).
      - name: Trivy scan — ${{ matrix.service.name }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service.name }}:ci
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Upload Trivy SARIF to GitHub code-scanning
        if: ${{ always() && hashFiles(format('trivy-{0}.sarif', matrix.service.name)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif
          category: trivy-${{ matrix.service.name }}

      # ── SBOM generation (Syft) ─────────────────────────────────────────
      - name: Generate SBOM (CycloneDX) — ${{ matrix.service.name }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.service.name }}:ci
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service.name }}.cdx.json
          upload-artifact: false

      # ── Push + sign (only on main, not PRs) ────────────────────────────
      # On PRs we build/scan/SBOM but don't push or sign (no ghcr write).
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag + push ${{ matrix.service.name }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/signal-forge/${{ matrix.service.name }}"
          SHA="${{ github.sha }}"
          docker tag ${{ matrix.service.name }}:ci "${IMAGE}:${SHA}"
          docker tag ${{ matrix.service.name }}:ci "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"
          # Capture the registry digest for cosign.
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${SHA}" --format '{{.Manifest.Digest}}')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless OIDC) — ${{ matrix.service.name }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Attach SBOM attestation — ${{ matrix.service.name }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --predicate sbom-${{ matrix.service.name }}.cdx.json \
            --type cyclonedx \
            "${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}"

      # Signatures were produced but never verified anywhere downstream —
      # "we sign our images" provided audit value only, zero enforcement.
      # This doesn't add admission-time enforcement (still a cluster-scoped
      # decision — see https://shipsolid.github.io/signal-forge/operations/security/
      # and operations/supply-chain.md) but
      # it does mean the sign→verify round-trip is actually exercised on
      # every push to main, catching config drift in the signing step itself
      # instead of only ever being checked manually, if at all.
      - name: Verify signature — ${{ matrix.service.name }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service.name }}
          path: sbom-${{ matrix.service.name }}.cdx.json
