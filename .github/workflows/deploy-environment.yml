name: Deploy immutable release to one environment

'on':
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      overlay:
        required: true
        type: string
      git_sha:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
      release_manifest:
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  packages: read

jobs:
  deploy:
    name: Deploy + validate ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.ENVIRONMENT_URL }}
    concurrency:
      group: signal-forge-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      ENVIRONMENT_URL: ${{ vars.ENVIRONMENT_URL }}
      FARO_COLLECTOR_URL: ${{ vars.FARO_COLLECTOR_URL }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      KUBE_CONTEXT: ${{ vars.KUBE_CONTEXT }}
      OBSERVABILITY_GATE_ENABLED: ${{ vars.OBSERVABILITY_GATE_ENABLED }}
      OBSERVABILITY_GATE_URL: ${{ vars.OBSERVABILITY_GATE_URL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      RELEASE_CI_RUN_ID: ${{ inputs.ci_run_id }}
      RELEASE_GIT_SHA: ${{ inputs.git_sha }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      KUSTOMIZE_OVERLAY: ${{ inputs.overlay }}
    steps:
      - name: Checkout the exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Validate release metadata and deployment configuration
        env:
          DB_SECRETS_ENV: ${{ secrets.DB_SECRETS_ENV }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_ENVIRONMENT" =~ ^(dev|qa|prod)$ ]]; then
            echo "::error::Unsupported environment"
            exit 1
          fi
          if [[ ! "$RELEASE_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release commit must be a full SHA"
            exit 1
          fi
          if [[ ! "$RELEASE_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Release CI run ID must be numeric"
            exit 1
          fi
          case "$TARGET_ENVIRONMENT" in
            dev) expected_overlay=k8s/overlays/dev ;;
            qa) expected_overlay=k8s/overlays/staging ;;
            prod) expected_overlay=k8s/overlays/prod ;;
          esac
          if [[ "$KUSTOMIZE_OVERLAY" != "$expected_overlay" ]]; then
            echo "::error::Overlay does not match the target environment"
            exit 1
          fi
          if [[ ! "$DEPLOY_ENABLED" =~ ^(true|false)?$ ]]; then
            echo "::error::DEPLOY_ENABLED must be true, false, or unset"
            exit 1
          fi

          printf '%s\n' "$RELEASE_MANIFEST" > release-manifest.json
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          expected_root="ghcr.io/${owner}/signal-forge"
          jq -e \
            --arg sha "$RELEASE_GIT_SHA" \
            --argjson run_id "$RELEASE_CI_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg root "$expected_root" '
              .schema_version == 1 and
              .git.commit == $sha and
              .git.repository == $repository and
              .git.ref == "refs/heads/main" and
              .build.run_id == $run_id and
              (.images | keys | sort == [
                "gateway-api", "notification-svc", "order-api", "otel-frontend"
              ]) and
              all(
                .images | to_entries[];
                .value.repository == ($root + "/" + .key) and
                (.value.digest | test("^sha256:[0-9a-f]{64}$")) and
                .value.reference == (.value.repository + "@" + .value.digest)
              )
            ' release-manifest.json > /dev/null

          if [[ "$DEPLOY_ENABLED" == "true" ]]; then
            required_values=(
              ENVIRONMENT_URL
              FARO_COLLECTOR_URL
              OBSERVABILITY_GATE_URL
              OTEL_EXPORTER_OTLP_ENDPOINT
            )
            for name in "${required_values[@]}"; do
              if [[ -z "${!name}" ]]; then
                echo "::error::${name} is required for a real deployment"
                exit 1
              fi
            done
            if [[ "$OBSERVABILITY_GATE_ENABLED" != "true" ]]; then
              echo "::error::OBSERVABILITY_GATE_ENABLED=true is required"
              exit 1
            fi
            if [[ -z "$KUBE_CONFIG" ]]; then
              echo "::error::Environment secret KUBE_CONFIG is required"
              exit 1
            fi
            if [[ -z "$DB_SECRETS_ENV" || "$DB_SECRETS_ENV" == *CHANGE_ME* ]]; then
              echo "::error::Environment secret DB_SECRETS_ENV is missing or invalid"
              exit 1
            fi
          fi

      - name: Render immutable deployment plan
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          pip install PyYAML==6.0.3
          printf '%s\n' "$RELEASE_MANIFEST" > release-manifest.json

          prod_secrets="k8s/overlays/prod/prod.secrets.env"
          created_prod_secrets=false
          cleanup() {
            if [[ "$created_prod_secrets" == "true" ]]; then
              rm -f "$prod_secrets"
            fi
          }
          trap cleanup EXIT
          if [[ "$TARGET_ENVIRONMENT" == "prod" && ! -f "$prod_secrets" ]]; then
            cp "${prod_secrets}.example" "$prod_secrets"
            created_prod_secrets=true
          fi

          kubectl kustomize "$KUSTOMIZE_OVERLAY" > raw-deployment-plan.yaml
          namespace="${K8S_NAMESPACE:-otel-lab}"
          otel_endpoint="${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy.monitoring.svc.cluster.local:4317}"
          public_url="$ENVIRONMENT_URL"
          if [[ -z "$public_url" ]]; then
            if [[ "$TARGET_ENVIRONMENT" == "dev" ]]; then
              public_url=http://signal-forge.local
            else
              public_url="https://${TARGET_ENVIRONMENT}.signal-forge.invalid"
            fi
          fi
          python scripts/ci/render_deployment.py \
            --input raw-deployment-plan.yaml \
            --output deployment-plan.yaml \
            --release-manifest release-manifest.json \
            --namespace "$namespace" \
            --environment "$TARGET_ENVIRONMENT" \
            --otel-endpoint "$otel_endpoint" \
            --faro-url "$FARO_COLLECTOR_URL" \
            --api-base-url /api \
            --public-url "$public_url"

          if grep -Eq 'image: .+:local|imagePullPolicy: Never' deployment-plan.yaml; then
            echo "::error::Local-only image configuration remains in the plan"
            exit 1
          fi
          if grep -Eq '^kind: Secret$' deployment-plan.yaml; then
            echo "::error::Deployment plan must not contain secret material"
            exit 1
          fi

      - name: Upload deployment plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: deployment-plan-${{ inputs.environment }}-${{ inputs.git_sha }}
          path: deployment-plan.yaml
          if-no-files-found: error
          retention-days: 30

      - name: Explain render-only mode
        if: vars.DEPLOY_ENABLED != 'true'
        run: |
          {
            echo "## Render-only deployment"
            echo
            echo "Environment: $TARGET_ENVIRONMENT"
            echo "Release commit: $RELEASE_GIT_SHA"
            echo "CI run: $RELEASE_CI_RUN_ID"
            echo
            echo "No cluster changes were made because DEPLOY_ENABLED is not true."
            echo "Set environment-scoped variables and secrets before enabling deploys."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        if: vars.DEPLOY_ENABLED == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: vars.DEPLOY_ENABLED == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Gate — published digests, signatures, and SBOM attestations
        if: vars.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          for service in otel-frontend gateway-api order-api notification-svc; do
            reference="$(jq -r --arg service "$service" '.images[$service].reference' \
              release-manifest.json)"
            docker manifest inspect "$reference" > /dev/null
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$reference" > /dev/null
            cosign verify-attestation \
              --type cyclonedx \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$reference" > /dev/null
            echo "Verified $service at ${reference##*@}"
          done

      - name: Configure cluster access
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          printf '%s\n' "$KUBE_CONFIG" > "$kubeconfig"
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          if [[ -n "$KUBE_CONTEXT" ]]; then
            kubectl --kubeconfig "$kubeconfig" config use-context "$KUBE_CONTEXT"
          fi
          kubectl --kubeconfig "$kubeconfig" cluster-info

      - name: Apply environment-scoped database secrets
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          DB_SECRETS_ENV: ${{ secrets.DB_SECRETS_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          namespace="${K8S_NAMESPACE:-otel-lab}"
          secret_file="$RUNNER_TEMP/db-secrets.env"
          trap 'rm -f "$secret_file"' EXIT
          printf '%s\n' "$DB_SECRETS_ENV" > "$secret_file"
          chmod 600 "$secret_file"

          required_keys=(
            MYSQL_PASSWORD
            MYSQL_ROOT_PASSWORD
            POSTGRES_PASSWORD
            RABBITMQ_USER
            RABBITMQ_PASSWORD
            GATEWAY_DB_CONNECTION
            ORDER_DB_CONNECTION
          )
          for key in "${required_keys[@]}"; do
            if ! grep -Eq "^${key}=.+" "$secret_file"; then
              echo "::error::DB_SECRETS_ENV is missing $key"
              exit 1
            fi
          done

          kubectl create namespace "$namespace" --dry-run=client -o yaml \
            | kubectl apply -f -
          kubectl create secret generic db-secrets \
            --namespace "$namespace" \
            --from-env-file "$secret_file" \
            --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Capture previous known-good release
        if: vars.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          namespace="${K8S_NAMESPACE:-otel-lab}"
          previous_images="$RUNNER_TEMP/previous-images.json"
          echo '{}' > "$previous_images"
          for service in otel-frontend gateway-api order-api notification-svc; do
            if ! kubectl -n "$namespace" get deployment "$service" > /dev/null 2>&1; then
              continue
            fi
            reference="$(kubectl -n "$namespace" get deployment "$service" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')"
            if [[ "$reference" =~ @sha256:[0-9a-f]{64}$ ]]; then
              jq --arg service "$service" --arg reference "$reference" \
                '. + {($service): $reference}' "$previous_images" \
                > "${previous_images}.new"
              mv "${previous_images}.new" "$previous_images"
            else
              echo "::warning::Previous $service image is not immutable; it cannot be a rollback target"
            fi
          done
          echo "PREVIOUS_IMAGES_FILE=$previous_images" >> "$GITHUB_ENV"

          for configmap in signal-forge-app-env frontend-env-js; do
            output="$RUNNER_TEMP/previous-${configmap}.json"
            if kubectl -n "$namespace" get configmap "$configmap" -o json > "$output" 2>/dev/null; then
              echo "Captured previous $configmap"
            else
              rm -f "$output"
            fi
          done

      - name: Apply immutable release
        id: apply
        if: vars.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          namespace="${K8S_NAMESPACE:-otel-lab}"
          kubectl apply --dry-run=server -f deployment-plan.yaml > /dev/null
          kubectl apply -f deployment-plan.yaml

          resources=(
            statefulset/mysql
            statefulset/postgres
            statefulset/rabbitmq
            deployment/gateway-api
            deployment/order-api
            deployment/notification-svc
            deployment/otel-frontend
            deployment/redis
          )
          pids=()
          for resource in "${resources[@]}"; do
            kubectl -n "$namespace" rollout status "$resource" --timeout=300s &
            pids+=("$!")
          done
          rollout_status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || rollout_status=1
          done
          exit "$rollout_status"

      - name: Gate — deployment health and exact image digests
        if: vars.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          namespace="${K8S_NAMESPACE:-otel-lab}"
          for service in otel-frontend gateway-api order-api notification-svc; do
            expected="$(jq -r --arg service "$service" '.images[$service].reference' \
              release-manifest.json)"
            expected_digest="${expected##*@}"
            actual="$(kubectl -n "$namespace" get deployment "$service" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$service Deployment does not reference the release digest"
              exit 1
            fi

            kubectl -n "$namespace" get deployment "$service" -o json \
              | jq -e '
                  (.status.observedGeneration >= .metadata.generation) and
                  (.status.updatedReplicas == .spec.replicas) and
                  (.status.availableReplicas == .spec.replicas) and
                  (.status.unavailableReplicas // 0) == 0
                ' > /dev/null

            pod_status="$(kubectl -n "$namespace" get pods -l "app=$service" -o json)"
            if jq -e 'any(.items[].status.containerStatuses[]?; .restartCount > 0)' \
              <<< "$pod_status" > /dev/null; then
              echo "::error::$service has restarted containers in the candidate rollout"
              exit 1
            fi
            if ! jq -e --arg digest "$expected_digest" '
              .items | length > 0 and
              all(.[].status.containerStatuses[]?; .imageID | contains($digest))
            ' <<< "$pod_status" > /dev/null; then
              echo "::error::$service pods are not running digest $expected_digest"
              exit 1
            fi
          done

      - name: Gate — smoke tests
        if: vars.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_url="${ENVIRONMENT_URL%/}"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors --max-time 15 \
            "$base_url/" > /dev/null
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors --max-time 15 \
            "$base_url/api/projects/" \
            | jq -e 'type == "array"' > /dev/null

      - name: Gate — configured observability release policy
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          OBSERVABILITY_GATE_TOKEN: ${{ secrets.OBSERVABILITY_GATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl_args=(
            --fail
            --silent
            --show-error
            --connect-timeout 10
            --get
            --max-time 60
            --data-urlencode "environment=$TARGET_ENVIRONMENT"
            --data-urlencode "git_sha=$RELEASE_GIT_SHA"
            --data-urlencode "image_sha=$RELEASE_GIT_SHA"
            --data-urlencode "ci_run_id=$RELEASE_CI_RUN_ID"
            --data-urlencode "required_services=gateway-api,order-api,notification-svc"
            --data-urlencode "required_signals=metrics,logs,traces"
            --data-urlencode "required_attributes=service.name,service.version,deployment.environment"
          )
          if [[ -n "$OBSERVABILITY_GATE_TOKEN" ]]; then
            curl_args+=(--header "Authorization: Bearer $OBSERVABILITY_GATE_TOKEN")
          fi
          response="$(curl "${curl_args[@]}" "$OBSERVABILITY_GATE_URL")"
          status="$(jq -r '.status // ""' <<< "$response")"
          summary="$(jq -r '.summary // "No summary provided"' <<< "$response")"
          case "$status" in
            pass)
              echo "Observability gate passed: $summary"
              ;;
            warn)
              if [[ "$TARGET_ENVIRONMENT" == "prod" ]]; then
                echo "::error::Production observability warning: $summary"
                exit 1
              fi
              echo "::warning title=Observability gate::$summary"
              ;;
            block)
              echo "::error::Observability gate blocked promotion: $summary"
              exit 1
              ;;
            *)
              echo "::error::Observability gate returned unknown status: $status"
              exit 1
              ;;
          esac

      - name: Gate — OWASP ZAP baseline (DEV only)
        if: inputs.environment == 'dev' && vars.DEPLOY_ENABLED == 'true'
        timeout-minutes: 10
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: ${{ vars.ENVIRONMENT_URL }}
          fail_action: true
          allow_issue_writing: false
          cmd_options: -I
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          artifact_name: zap-dev-${{ inputs.git_sha }}

      - name: Roll back to the previous immutable release
        if: failure() && vars.DEPLOY_ENABLED == 'true' && steps.apply.outcome != 'skipped'
        shell: bash
        run: |
          set -uo pipefail
          namespace="${K8S_NAMESPACE:-otel-lab}"
          if [[ ! -s "${PREVIOUS_IMAGES_FILE:-}" ]] \
            || ! jq -e 'length == 4' "$PREVIOUS_IMAGES_FILE" > /dev/null; then
            echo "::error::No complete previous immutable release is available for rollback"
            exit 1
          fi

          for configmap in signal-forge-app-env frontend-env-js; do
            previous="$RUNNER_TEMP/previous-${configmap}.json"
            if [[ -s "$previous" ]]; then
              jq 'del(
                .metadata.creationTimestamp,
                .metadata.resourceVersion,
                .metadata.uid,
                .metadata.managedFields,
                .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"
              )' "$previous" | kubectl apply -f -
            fi
          done

          rollback_status=0
          for service in otel-frontend gateway-api order-api notification-svc; do
            previous="$(jq -r --arg service "$service" '.[$service]' \
              "$PREVIOUS_IMAGES_FILE")"
            kubectl -n "$namespace" set image \
              "deployment/$service" "$service=$previous" || rollback_status=1
          done
          pids=()
          for service in gateway-api order-api notification-svc otel-frontend; do
            kubectl -n "$namespace" rollout status \
              "deployment/$service" --timeout=300s &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || rollback_status=1
          done
          if [[ "$rollback_status" -ne 0 ]]; then
            echo "::error::Rollback did not restore every workload"
            exit 1
          fi
          echo "::warning::Candidate failed; previous immutable digests restored"

      - name: Publish deployment summary
        if: success() && vars.DEPLOY_ENABLED == 'true'
        run: |
          {
            echo "## Deployment passed"
            echo
            echo "- Environment: $TARGET_ENVIRONMENT"
            echo "- Git commit: $RELEASE_GIT_SHA"
            echo "- CI run: $RELEASE_CI_RUN_ID"
            echo "- Images: immutable release-manifest digests"
            echo "- Rollout: health, smoke, and observability gates passed"
          } >> "$GITHUB_STEP_SUMMARY"
