name: CD

'on':
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-branch CI run containing an immutable release manifest
        required: true
        type: string
      confirm_production:
        description: Promote through the protected prod environment after QA
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  deployments: write
  packages: read

concurrency:
  group: signal-forge-release-promotion
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve immutable CI release
    runs-on: ubuntu-latest
    outputs:
      ci-run-id: ${{ steps.release.outputs.ci-run-id }}
      git-sha: ${{ steps.release.outputs.git-sha }}
      manifest: ${{ steps.release.outputs.manifest }}
    steps:
      - name: Validate CI run
        id: ci-run
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::ci_run_id must be a numeric GitHub Actions run ID"
            exit 1
          fi

          run="$(curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" '
              .name == "CI" and
              .path == ".github/workflows/ci.yml" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              (.event == "push" or .event == "workflow_dispatch") and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$run" > /dev/null || {
              echo "::error::Run is not a successful trusted main-branch CI release"
              exit 1
            }
          head_sha="$(jq -r '.head_sha' <<< "$run")"
          run_attempt="$(jq -r '.run_attempt' <<< "$run")"
          {
            echo "head-sha=$head_sha"
            echo "run-attempt=$run_attempt"
          } >> "$GITHUB_OUTPUT"
          jq '{id, head_sha, event, conclusion, html_url}' <<< "$run"

      - name: Download release manifest from CI
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: release-manifest-${{ steps.ci-run.outputs.run-attempt }}
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Validate release manifest
        id: release
        env:
          CI_HEAD_SHA: ${{ steps.ci-run.outputs.head-sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.ci-run.outputs.run-attempt }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=release/release-manifest.json
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          expected_root="ghcr.io/${owner}/signal-forge"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head_sha "$CI_HEAD_SHA" \
            --argjson run_id "$CI_RUN_ID" \
            --argjson run_attempt "$CI_RUN_ATTEMPT" \
            --arg root "$expected_root" '
              .schema_version == 1 and
              .git.repository == $repository and
              .git.ref == "refs/heads/main" and
              .git.commit == $head_sha and
              .build.workflow == ".github/workflows/ci.yml" and
              .build.run_id == $run_id and
              .build.run_attempt == $run_attempt and
              (.images | keys | sort == [
                "gateway-api", "notification-svc", "order-api", "otel-frontend"
              ]) and
              all(
                .images | to_entries[];
                .value.repository == ($root + "/" + .key) and
                (.value.digest | test("^sha256:[0-9a-f]{64}$")) and
                .value.reference == (.value.repository + "@" + .value.digest)
              )
            ' "$manifest" > /dev/null

          git_sha="$(jq -r '.git.commit' "$manifest")"
          compact_manifest="$(jq -c . "$manifest")"
          {
            echo "ci-run-id=$CI_RUN_ID"
            echo "git-sha=$git_sha"
            echo "manifest=$compact_manifest"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release selected"
            echo
            echo "- CI run: $CI_RUN_ID"
            echo "- CI run attempt: $CI_RUN_ATTEMPT"
            echo "- Git commit: $git_sha"
            echo
            jq -r '.images | to_entries[] | "- \(.key): \(.value.reference)"' "$manifest"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Promote immutable release to DEV
    needs: resolve-release
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      overlay: k8s/overlays/dev
      git_sha: ${{ needs.resolve-release.outputs.git-sha }}
      ci_run_id: ${{ needs.resolve-release.outputs.ci-run-id }}
      release_manifest: ${{ needs.resolve-release.outputs.manifest }}
    secrets: inherit

  deploy-qa:
    name: Promote same immutable release to QA
    needs:
      - resolve-release
      - deploy-dev
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: qa
      overlay: k8s/overlays/staging
      git_sha: ${{ needs.resolve-release.outputs.git-sha }}
      ci_run_id: ${{ needs.resolve-release.outputs.ci-run-id }}
      release_manifest: ${{ needs.resolve-release.outputs.manifest }}
    secrets: inherit

  deploy-prod:
    name: Promote same immutable release to PROD
    if: inputs.confirm_production
    needs:
      - resolve-release
      - deploy-qa
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      overlay: k8s/overlays/prod
      git_sha: ${{ needs.resolve-release.outputs.git-sha }}
      ci_run_id: ${{ needs.resolve-release.outputs.ci-run-id }}
      release_manifest: ${{ needs.resolve-release.outputs.manifest }}
    secrets: inherit
