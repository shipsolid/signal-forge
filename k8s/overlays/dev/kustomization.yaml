# Dev overlay — current k3d lab settings (2 replicas, relaxed probes, low resources).
# The base manifests already reflect dev today, so this overlay is mostly identity.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      signal-forge.environment: dev

