# Historical staging overlay reused by CD as the `qa` resource topology. The CD
# renderer normalizes its inherited labels to `qa` and removes dev-only ingress
# fallback routing. This overlay increases replicas and changes the hostname; it
# does not define stricter resource limits.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      signal-forge.environment: staging

# Raise replica counts on app tier for staging.
patches:
  - target: { kind: Deployment, name: gateway-api }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Deployment, name: order-api }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Deployment, name: notification-svc }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Ingress, name: otel-lab-ingress }
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: signal-forge.staging.example.com
      - op: replace
        path: /spec/rules/0/host
        value: signal-forge.staging.example.com
