# Prod overlay — larger replicas, tighter resources, prod ingress host, no
# local-only manifests (no in-cluster Prometheus/Jaeger/Loki/Grafana — those
# are only applied by deploy-local.sh when monitoring.mode=local; they're not
# in the base Kustomization).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - hpa.yaml

labels:
  - pairs:
      signal-forge.environment: prod

# Direct Kustomize usage: fail-closed override of base's db-secrets. Base ships
# the placeholder dev
# credentials from k8s/infra/secrets.yaml (gateway_pw, root_pw, ...) with no
# structural gate stopping prod from silently inheriting them. prod.secrets.env
# is gitignored (ship only prod.secrets.env.example) — without a real one in
# place, `kubectl kustomize`/`apply -k k8s/overlays/prod` fails outright instead
# of deploying prod-sized replicas with dev-grade secrets. CD supplies a temporary
# example input solely to render then strips all Secret objects, creating the real
# `db-secrets` separately from protected GitHub Environment values. `behavior: replace`
# + Kustomize's default hash suffix means every secretKeyRef: {name: db-secrets}
# elsewhere in the build gets automatically repointed at the new hashed name.
secretGenerator:
  - name: db-secrets
    namespace: otel-lab
    behavior: replace
    envs:
      - prod.secrets.env

# Prod-sized replica counts + resource asks.
patches:
  - target: { kind: Deployment, name: gateway-api }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 6
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target: { kind: Deployment, name: order-api }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 6
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target: { kind: Deployment, name: notification-svc }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 4
  - target: { kind: Ingress, name: otel-lab-ingress }
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: signal-forge.example.com
      - op: replace
        path: /spec/rules/0/host
        value: signal-forge.example.com
  # Anti-affinity becomes required (not preferred) in prod.
  - target: { kind: Deployment, name: gateway-api }
    patch: |
      - op: replace
        path: /spec/template/spec/affinity/podAntiAffinity
        value:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: gateway-api
  - target: { kind: Deployment, name: order-api }
    patch: |
      - op: replace
        path: /spec/template/spec/affinity/podAntiAffinity
        value:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: order-api

  # Base PDBs are minAvailable: 1 against 2 base-replica Deployments — correct
  # there, but far weaker than intended once the replica patches above bump
  # gateway-api/order-api to 6 and notification-svc to 4. Percentage-based
  # minAvailable tracks the replica count automatically instead of needing a
  # separate absolute-number patch that drifts every time the replica count
  # changes.
  - target: { kind: PodDisruptionBudget, name: gateway-api }
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 50%
  - target: { kind: PodDisruptionBudget, name: order-api }
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 50%
  - target: { kind: PodDisruptionBudget, name: notification-svc }
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 50%
