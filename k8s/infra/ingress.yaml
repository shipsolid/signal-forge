apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-lab-ingress
  namespace: otel-lab
  annotations:
    # k3d uses Traefik by default. `websecure` listens on 443 (TLS); `web` on 80.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # cert-manager issues the leaf cert from the signal-forge-ca ClusterIssuer
    # defined in k8s/infra/cert-manager-issuer.yaml.
    cert-manager.io/cluster-issuer: signal-forge-ca
spec:
  tls:
    - hosts:
        - signal-forge.local
      secretName: signal-forge-tls
  rules:
    - host: signal-forge.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-api
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otel-frontend
                port:
                  number: 80
    # Keep a hostless rule so http://localhost:8080 still works on k3d for dev,
    # even though the cert is only issued for signal-forge.local. TLS routing
    # only applies on the host-scoped rule above.
    #
    # WARNING — dev-only, deliberately: this rule matches ANY Host header
    # (no TLS, no redirect) and duplicates the paths above verbatim. Do not
    # copy-paste this rule forward into a staging/prod overlay — a
    # production ingress should not have a plaintext catch-all sitting next
    # to its TLS-enforced host rule. If you're promoting this manifest to a
    # real environment, delete this second rule entirely rather than "fixing"
    # it with an ssl-redirect annotation.
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-api
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otel-frontend
                port:
                  number: 80
