# Self-signed ClusterIssuer + CA for the lab.
#
# Flow:
#   selfsigned-bootstrap  → issues a self-signed root cert (one-off)
#   signal-forge-ca       → a CA backed by that root (issues all leaf certs)
#   Ingress annotations   → cert-manager.io/cluster-issuer: signal-forge-ca
#
# For a real cluster, replace signal-forge-ca with a LetsEncrypt ACME issuer
# (http-01 or dns-01). For internal domains, point at your enterprise CA via
# cert-manager-venafi or cert-manager-origin-ca-issuer.
#
# Prereq: cert-manager installed in the cluster. deploy-local.sh handles this
# when monitoring.mode is cloud (or --with-tls flag). See:
#   https://cert-manager.io/docs/installation/helm/
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: signal-forge-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: signal-forge-ca
  secretName: signal-forge-ca-key-pair
  duration: 87600h    # 10 years — lab CA root
  renewBefore: 720h   # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: signal-forge-ca
spec:
  ca:
    secretName: signal-forge-ca-key-pair
