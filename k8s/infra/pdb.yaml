# PodDisruptionBudgets for app and datastore tiers.
#
# App tier: 2 replicas each, minAvailable=1 → rolling updates and voluntary
# node drains never take all replicas down simultaneously.
#
# Datastore tier: 1 replica each. A minAvailable=1 PDB here blocks voluntary
# evictions entirely — the right behaviour for single-replica stores; kubectl
# drain must --force or wait for manual intervention.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-api
  namespace: otel-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-api
  namespace: otel-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: order-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-svc
  namespace: otel-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: notification-svc
---
# otel-frontend: single replica today; PDB set so voluntary evictions block
# until a new replica is scheduled (graceful rollout).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-frontend
  namespace: otel-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: otel-frontend
---
# One PDB per datastore, not a single PDB shared across the tier: a shared
# minAvailable:1 selector spanning all four is satisfied by the pool (e.g. mysql +
# postgres + rabbitmq could all be evicted simultaneously while only redis remains,
# legally satisfying "1 available"). Each store needs its own budget.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mysql
  namespace: otel-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mysql
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres
  namespace: otel-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  namespace: otel-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq
  namespace: otel-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rabbitmq
