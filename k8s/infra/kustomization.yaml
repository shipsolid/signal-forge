apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets.yaml
  - pdb.yaml
  - network-policies.yaml
  - ingress.yaml
  # cert-manager-issuer.yaml is deliberately NOT listed here — see
  # https://shipsolid.github.io/notes/shipsolid/app-signal-forge/infrastructure/kustomize/
  # for why it can't safely join this
  # resource list (k8s/base sets a blanket `namespace: otel-lab`, and
  # Kustomize's namespace transformer doesn't know `ClusterIssuer` is
  # cluster-scoped; it silently reassigns the CA `Certificate`'s explicit
  # `namespace: cert-manager` to `otel-lab` too, breaking cert-manager's CA
  # bootstrap chain). GitOps consumers must apply it as a separate step.
