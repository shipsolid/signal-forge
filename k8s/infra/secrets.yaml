# LOCAL LAB PLACEHOLDERS ONLY. Base64 is encoding, not encryption; committing a
# real value here exposes it. deploy-local.sh may apply this file for k3d, while
# production CD strips repository Secret objects from its plan and creates the
# same `db-secrets` name from protected GitHub Environment secret material.
# Generate a local placeholder with: echo -n 'value' | base64 -w0
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: otel-lab
type: Opaque
data:
  # gateway_pw
  MYSQL_PASSWORD: Z2F0ZXdheV9wdw==
  # root_pw
  MYSQL_ROOT_PASSWORD: cm9vdF9wdw==
  # order_pw
  POSTGRES_PASSWORD: b3JkZXJfcHc=
  # signalforge — purpose-named application user, not the reserved `guest`
  # account. Rotate RABBITMQ_PASSWORD alongside this in any real environment;
  # they're paired the same way MYSQL_PASSWORD/POSTGRES_PASSWORD are.
  RABBITMQ_USER: c2lnbmFsZm9yZ2U=
  # guest (placeholder value — same WARNING at the top of this file applies)
  RABBITMQ_PASSWORD: Z3Vlc3Q=
  # Full connection strings (avoids embedding passwords in deployment manifests)
  # Server=mysql;Database=gatewaydb;User=gateway;Password=gateway_pw;
  GATEWAY_DB_CONNECTION: U2VydmVyPW15c3FsO0RhdGFiYXNlPWdhdGV3YXlkYjtVc2VyPWdhdGV3YXk7UGFzc3dvcmQ9Z2F0ZXdheV9wdzs=
  # Host=postgres;Database=orderdb;Username=orderuser;Password=order_pw;
  ORDER_DB_CONNECTION: SG9zdD1wb3N0Z3JlcztEYXRhYmFzZT1vcmRlcmRiO1VzZXJuYW1lPW9yZGVydXNlcjtQYXNzd29yZD1vcmRlcl9wdzs=
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-secrets
  namespace: otel-lab
type: Opaque
data:
  # Set these to your Grafana Cloud credentials (base64 encoded).
  # Source: Azure Key Vault example-org-prd-kv  (grafana-example-org-* secrets)
  # Populate via: make secrets-fetch-akv
  # Leave empty/unset for local-only mode — cloud exporters will silently no-op.
  #
  # Each signal uses its own numeric instance ID as the HTTP Basic Auth username.
  # The API key is shared across all three signals.
  GRAFANA_CLOUD_API_KEY: ""
  # Tempo (traces)
  GRAFANA_CLOUD_TEMPO_ENDPOINT: ""
  GRAFANA_CLOUD_TEMPO_USER: ""
  # Mimir (metrics)
  GRAFANA_CLOUD_MIMIR_ENDPOINT: ""
  GRAFANA_CLOUD_MIMIR_USER: ""
  # Loki (logs)
  GRAFANA_CLOUD_LOKI_ENDPOINT: ""
  GRAFANA_CLOUD_LOKI_USER: ""
  # Faro RUM (frontend)
  # AKV: grafana-example-org-faro-collector-url  — browser → Faro collector endpoint
  FARO_COLLECTOR_URL: ""
  # AKV: grafana-example-org-faro-api-key  — webpack plugin source map upload (build-time)
  FARO_API_KEY: ""
