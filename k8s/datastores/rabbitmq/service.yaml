apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: otel-lab
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
      # Local-lab browser access through the k3d port mapping. A production
      # RabbitMQ management plane must use private ingress/access controls, not
      # an unauthenticated node-wide exposure.
      nodePort: 30672
  type: NodePort
