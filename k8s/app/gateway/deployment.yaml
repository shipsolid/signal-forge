apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: otel-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-api
      tier: app
  template:
    metadata:
      labels:
        app: gateway-api
        tier: app
        app.kubernetes.io/name: gateway-api
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      # Soft anti-affinity: prefer scheduling replicas on distinct nodes.
      # No-op on single-node k3d; meaningful on multi-node clusters.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: gateway-api
      containers:
        - name: gateway-api
          image: gateway-api:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            # Shared OTLP endpoint + resource attributes. Generated from conf.yml
            # by deploy-local.sh → apply_app_env_configmap. See k8s/infra/app-env.yaml.tmpl.
            - configMapRef:
                name: signal-forge-app-env
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # 0.0.0.0, not +: confirmed empirically against a live k3d cluster
            # that Kestrel's "+" wildcard bound IPv6-only ([::]:5000, no IPv4
            # socket at all — verified via /proc/net/tcp showing nothing on
            # this port while /proc/net/tcp6 showed a LISTEN entry) in this
            # environment, refusing every IPv4 connection including kubelet's
            # own probes and the flannel pod network (IPv4-only, no v6 CIDR).
            - name: ASPNETCORE_URLS
              value: http://0.0.0.0:5000
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: GATEWAY_DB_CONNECTION
            # Port 5002, not 5001 — order-api splits HTTP/1.1 (/healthz, 5001)
            # from HTTP/2-only gRPC (5002) onto separate Kestrel endpoints; see
            # order-api's Program.cs "gRPC server" comment for why they can't
            # share one cleartext port.
            - name: OrderApi__Address
              value: "http://order-api:5002"
            - name: NotificationSvc__Address
              value: "http://notification-svc:8000"
            # Must match DiagnosticsConfig.ServiceName in src/gateway-api/Telemetry/DiagnosticsConfig.cs
            # (env var takes precedence over AddService() in ResourceBuilder — keep in sync)
            - name: OTEL_SERVICE_NAME
              value: gateway-api
            # kubelet's HTTP probe connects using the pod's own IP as the Host
            # header — AllowedHosts (appsettings.json) can't list that ahead of
            # time since pod IPs are ephemeral and only known once scheduled.
            # Injected via the Downward API; Program.cs appends it to the
            # configured AllowedHosts at startup. (An httpHeaders Host override
            # on the probes themselves was tried first and doesn't reach
            # ASP.NET Core's host filtering — confirmed empirically against a
            # live k3d cluster, still gave a 400.)
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
