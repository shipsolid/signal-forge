apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  namespace: otel-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-svc
      tier: app
  template:
    metadata:
      labels:
        app: notification-svc
        tier: app
        app.kubernetes.io/name: notification-svc
        app.kubernetes.io/component: notification-service
        # Local fallback only. CD overwrites this with the full release Git SHA,
        # matching OTEL service.version and the immutable image manifest.
        app.kubernetes.io/version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: notification-svc
      containers:
        - name: notification-svc
          # Local k3d imports this tag and therefore uses Never. CD replaces both
          # fields with an immutable GHCR digest plus IfNotPresent; no promoted
          # environment consumes the mutable/local marker.
          image: notification-svc:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            # Shared OTLP endpoint + resource attributes. Local deployment uses
            # k8s/infra/app-env.yaml.tmpl; CD generates the same contract with
            # the selected release SHA and target environment.
            - configMapRef:
                name: signal-forge-app-env
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: RABBITMQ_PASSWORD
            - name: OTEL_SERVICE_NAME
              value: notification-svc
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            # /readyz reflects actual consumer/Redis state — a backed-off consumer or
            # unreachable Redis pulls this pod from service rotation instead of
            # reporting healthy while doing no useful work.
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            # Deliberately the simpler /healthz (process alive only) — restarting the
            # pod is the wrong response to an external dependency outage.
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
