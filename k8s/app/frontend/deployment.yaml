apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-frontend
  namespace: otel-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-frontend
      tier: app
  template:
    metadata:
      labels:
        app: otel-frontend
        tier: app
        app.kubernetes.io/name: otel-frontend
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-frontend
          image: otel-frontend:local
          imagePullPolicy: Never
          securityContext:
            # readOnlyRootFilesystem is safe now that env.js — the one thing
            # this container used to write to its own root fs at startup —
            # comes from a mounted ConfigMap (frontend-env-js, see the volume
            # below) instead of an entrypoint script. nginx's own writable
            # paths (cache, pid, client-body temp files) are covered by the
            # three emptyDir mounts below.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            # Shadows the image's baked-in default env.js with the real
            # FARO_URL/API_BASE_URL, rendered by deploy-local.sh's
            # apply_frontend_env_configmap() from the same Grafana Cloud
            # credentials already resolved for grafana-cloud-secrets. A
            # pod restart with a changed ConfigMap picks up the new value
            # immediately — nginx.conf disables caching on this path.
            - name: frontend-env-js
              mountPath: /usr/share/nginx/html/assets/env.js
              subPath: env.js
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: frontend-env-js
          configMap:
            name: frontend-env-js
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
