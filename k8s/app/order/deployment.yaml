apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: otel-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-api
      tier: app
  template:
    metadata:
      labels:
        app: order-api
        tier: app
        app.kubernetes.io/name: order-api
        app.kubernetes.io/component: order-service
        app.kubernetes.io/version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: order-api
      containers:
        - name: order-api
          image: order-api:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            # Shared OTLP endpoint + resource attributes — see k8s/infra/app-env.yaml.tmpl
            - configMapRef:
                name: signal-forge-app-env
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:5001
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ORDER_DB_CONNECTION
            - name: RabbitMQ__Host
              value: rabbitmq
            - name: RabbitMQ__Port
              value: "5672"
            - name: RabbitMQ__User
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: RABBITMQ_USER
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: RABBITMQ_PASSWORD
            # Must match DiagnosticsConfig.ServiceName in src/order-api/Telemetry/DiagnosticsConfig.cs
            # (env var takes precedence over AddService() in ResourceBuilder — keep in sync)
            - name: OTEL_SERVICE_NAME
              value: order-api
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5001
              # kubelet's default probe Host header is the pod IP, which
              # AllowedHosts (appsettings.json) doesn't — and can't, since pod
              # IPs are ephemeral — list. Pin it to an allow-listed name instead.
              httpHeaders:
                - name: Host
                  value: order-api
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5001
              httpHeaders:
                - name: Host
                  value: order-api
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
