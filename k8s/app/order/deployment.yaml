apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: otel-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-api
      tier: app
  template:
    metadata:
      labels:
        app: order-api
        tier: app
        app.kubernetes.io/name: order-api
        app.kubernetes.io/component: order-service
        app.kubernetes.io/version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: order-api
      containers:
        - name: order-api
          image: order-api:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            # Shared OTLP endpoint + resource attributes — see k8s/infra/app-env.yaml.tmpl
            - configMapRef:
                name: signal-forge-app-env
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # 0.0.0.0, not +: confirmed empirically against a live k3d cluster
            # that Kestrel's "+" wildcard bound IPv6-only ([::]:5001, no IPv4
            # socket at all — verified via /proc/net/tcp showing nothing on
            # this port while /proc/net/tcp6 showed a LISTEN entry) in this
            # environment, refusing every IPv4 connection including kubelet's
            # own probes and the flannel pod network (IPv4-only, no v6 CIDR).
            - name: ASPNETCORE_URLS
              value: http://0.0.0.0:5001
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: ORDER_DB_CONNECTION
            - name: RabbitMQ__Host
              value: rabbitmq
            - name: RabbitMQ__Port
              value: "5672"
            - name: RabbitMQ__User
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: RABBITMQ_USER
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: RABBITMQ_PASSWORD
            # Must match DiagnosticsConfig.ServiceName in src/order-api/Telemetry/DiagnosticsConfig.cs
            # (env var takes precedence over AddService() in ResourceBuilder — keep in sync)
            - name: OTEL_SERVICE_NAME
              value: order-api
            # kubelet's HTTP probe connects using the pod's own IP as the Host
            # header — AllowedHosts (appsettings.json) can't list that ahead of
            # time since pod IPs are ephemeral and only known once scheduled.
            # Injected via the Downward API; Program.cs appends it to the
            # configured AllowedHosts at startup. (An httpHeaders Host override
            # on the probes themselves was tried first and doesn't reach
            # ASP.NET Core's host filtering — confirmed empirically against a
            # live k3d cluster, still gave a 400.)
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
