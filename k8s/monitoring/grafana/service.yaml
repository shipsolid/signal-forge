# Stable in-cluster receiver address for applications and the frontend Faro
# proxy in local mode. It selects the node-local Alloy DaemonSet; cloud mode
# obtains its collector endpoint from the Helm-managed k8s-monitoring stack.
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: otel-lab
spec:
  selector:
    app: alloy
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: faro
      port: 12347
      targetPort: 12347
    - name: metrics
      port: 12345
      targetPort: 12345
