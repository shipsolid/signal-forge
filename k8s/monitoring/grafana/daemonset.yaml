apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: otel-lab
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: alloy
          image: grafana/alloy:v1.14.0
          args:
            - run
            - /etc/alloy/config.river
            - --storage.path=/var/lib/alloy/data
          # No GRAFANA_CLOUD_* env vars here — this DaemonSet is the mode=local
          # config (k8s/monitoring/grafana/local/configmap.yaml), which routes
          # everything to in-cluster Jaeger/Prometheus/Loki only and never
          # references any Grafana Cloud credential. Cloud mode doesn't deploy
          # this DaemonSet at all (see monitoring.manifests.cloud: [] in
          # conf.yml) — it uses the grafana/k8s-monitoring Helm chart instead,
          # which reads grafana-cloud-secrets itself.
          ports:
            - name: otlp-grpc
              containerPort: 4317
              hostPort: 4317
            - name: otlp-http
              containerPort: 4318
              hostPort: 4318
            - name: faro
              containerPort: 12347
              hostPort: 12347
            - name: metrics
              containerPort: 12345
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          hostPath:
            path: /var/lib/alloy/data
            type: DirectoryOrCreate
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
