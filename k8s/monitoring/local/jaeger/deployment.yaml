# Local all-in-one trace backend. It keeps storage and collector/UI in one pod
# for a disposable lab, so it provides neither HA nor durable trace retention.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: otel-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          # all-in-one is intentionally a developer topology; production trace
          # storage/export is provided by the Grafana Cloud/Helm path instead.
          image: jaegertracing/all-in-one:1.55
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686   # UI
            - containerPort: 4317    # OTLP gRPC
            - containerPort: 4318    # OTLP HTTP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: otel-lab
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  # The UI NodePort is for a local browser only; OTLP is also available through
  # in-cluster Service DNS for the app/Alloy pipeline.
  type: NodePort
