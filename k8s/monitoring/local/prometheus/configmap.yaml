apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: otel-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # Enable exemplar storage
    storage:
      exemplars:
        max_exemplars: 100000

    # SLO burn-rate rules — mounted from the prometheus-slo-rules ConfigMap,
    # generated by deploy-local.sh's apply_local_slo_rules() from
    # k8s/monitoring/slo-rules.yaml (single source of truth, see that file's
    # header comment).
    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # Alloy metrics are now scraped by grafana/k8s-monitoring in the
      # monitoring namespace — no separate scrape job needed here.
