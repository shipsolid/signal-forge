apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: otel-lab
  # These dashboard JSONs are mounted at /var/lib/grafana/dashboards and
  # loaded automatically by the provisioning provider defined in
  # grafana-provisioning-dashboards ConfigMap (provider.yaml).
  # To update a dashboard: edit the JSON here and re-apply with kubectl apply.
data:
  service-overview.json: |
    {
      "title": "SignalForge — Service Overview",
      "uid": "service-overview",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by (service_name) (rate(traces_spanmetrics_calls_total[1m]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "P95 Latency by Route (span metrics)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le, http_route, service_name) (rate(traces_spanmetrics_latency_bucket[5m])))",
              "legendFormat": "{{service_name}} {{http_route}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error Rate by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by (service_name) (rate(traces_spanmetrics_calls_total{status_code=\"STATUS_CODE_ERROR\"}[1m]))",
              "legendFormat": "{{service_name}} errors"
            }
          ]
        },
        {
          "id": 4,
          "title": "In-flight Requests (gateway)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 8 },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "gateway_requests_inflight",
              "legendFormat": "In-flight"
            }
          ]
        },
        {
          "id": 5,
          "title": "Orders Created Total",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 8 },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum(orders_created_total)",
              "legendFormat": "Orders"
            }
          ]
        },
        {
          "id": 6,
          "title": "Notifications Processed",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by (status) (rate(notifications_processed_total[1m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "HTTP Request Duration Exemplars (gateway)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "options": { "exemplars": { "enabled": true } },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job=\"gateway-api\"}[5m])))",
              "legendFormat": "P99",
              "exemplarTraceIdDestinations": [{ "datasourceUid": "jaeger", "name": "traceID" }]
            }
          ]
        }
      ],
      "time": { "from": "now-1h", "to": "now" }
    }
  trace-analysis.json: |
    {
      "title": "SignalForge — Trace Analysis",
      "uid": "trace-analysis",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Trace Search",
          "type": "traces",
          "gridPos": { "h": 14, "w": 24, "x": 0, "y": 0 },
          "datasource": { "uid": "jaeger" },
          "targets": [
            {
              "datasource": { "uid": "jaeger" },
              "queryType": "search",
              "service": "",
              "operation": "",
              "limit": 20
            }
          ]
        },
        {
          "id": 2,
          "title": "Span Metrics — Call Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by (span_name, service_name) (rate(traces_spanmetrics_calls_total[1m]))",
              "legendFormat": "{{service_name}}/{{span_name}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Tail Sampling Effectiveness",
          "type": "timeseries",
          "description": "Compare span metrics (pre-sampling) vs sampled trace arrivals. Span metrics are generated BEFORE tail sampling, so this counter reflects 100% of traffic. Sampled traces in Jaeger should be ~25% of this rate for normal traffic.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum(rate(traces_spanmetrics_calls_total[1m]))",
              "legendFormat": "Total spans (pre-sample)"
            }
          ]
        },
        {
          "id": 4,
          "title": "Logs (Loki) — with trace correlation",
          "type": "logs",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 22 },
          "targets": [
            {
              "datasource": { "uid": "loki" },
              "expr": "{namespace=\"otel-lab\"}",
              "legendFormat": ""
            }
          ],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false
          }
        }
      ],
      "time": { "from": "now-1h", "to": "now" }
    }
