# Local-only Grafana profile. The single replica, NodePort, in-manifest
# `admin/admin` credentials, and ConfigMap provisioning make first-run lab
# exploration simple but are not a production authentication/HA design.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
  namespace: otel-lab
data:
  # These embedded provisioning files are mounted by the Grafana Deployment
  # below, keeping the local data-source topology reproducible without a manual
  # UI configuration step.
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.otel-lab.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: jaeger
      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger.otel-lab.svc.cluster.local:16686
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            filterBySpanID: true
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.otel-lab.svc.cluster.local:3100
        access: proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-dashboards
  namespace: otel-lab
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: otel-lab
        orgId: 1
        folder: OTel Lab
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: otel-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          # Static lab credentials only. Production must use a managed identity
          # or secret-backed bootstrap flow and must not inherit this manifest.
          image: grafana/grafana:11.0.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "traceToMetrics"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-provisioning-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-provisioning-dashboards
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: otel-lab
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
  # Browser convenience for k3d. A production dashboard must use authenticated
  # ingress rather than exposing Grafana through every cluster node.
  type: NodePort
