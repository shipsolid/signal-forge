apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus.otel-lab.svc.cluster.local:9090
    access: proxy
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: jaeger

  - name: Jaeger
    type: jaeger
    uid: jaeger
    url: http://jaeger.otel-lab.svc.cluster.local:16686
    access: proxy
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: true

  - name: Loki
    type: loki
    uid: loki
    url: http://loki.otel-lab.svc.cluster.local:3100
    access: proxy
    jsonData:
      derivedFields:
        # matcherType: label reads the trace_id value directly from Loki
        # structured metadata (see the Alloy config's loki.process
        # stage.structured_metadata block) instead of regexing the raw log
        # line body. The previous matcherRegex ('"trace_id":"(\w+)"') could
        # never match either source format — .NET's JSON logs use "TraceId",
        # Python's use "otelTraceID", and neither is literally "trace_id" in
        # the raw body; that name only exists after Alloy's structured-metadata
        # promotion. Label-based matching is immune to that raw-format
        # divergence entirely.
        - name: TraceID
          matcherType: label
          field: trace_id
          url: "$${__value.raw}"
          datasourceUid: jaeger
