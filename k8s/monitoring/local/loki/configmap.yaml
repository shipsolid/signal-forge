apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: otel-lab
data:
  loki.yaml: |
    # Single-process local profile: no auth, filesystem chunks, in-memory ring,
    # and one replica. These values deliberately trade durability/HA/security for
    # a quick lab bootstrap and must not be copied to a shared environment.
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      instance_addr: 127.0.0.1
      path_prefix: /var/loki
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    ruler:
      # There is no Alertmanager in this local stack. This preserves the normal
      # Loki configuration shape but cannot deliver alerts until one is added.
      alertmanager_url: http://localhost:9093
